---
layout: default
---
<div class="page-hero">
  <div class="container">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="post-meta">
      <i class="bi bi-calendar3 me-1"></i>{{ page.date | date: "%B %-d, %Y" }}
      {% if page.author %}<span class="ms-3"><i class="bi bi-person me-1"></i>{{ page.author }}</span>{% endif %}
      {% if page.categories %}<span class="ms-3"><i class="bi bi-tag me-1"></i>{{ page.categories | join: ", " }}</span>{% endif %}
    </p>
  </div>
</div>

<div class="page-content">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <article class="post-body">
          {{ content }}
        </article>
        <div class="mt-5">
          <a href="{{ '/news/' | relative_url }}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left me-2"></i>Back to News
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
